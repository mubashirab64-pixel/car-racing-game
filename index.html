<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Street Racer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 3D GAME -->
    <div id="game-container"></div>

    <!-- HUD -->
    <div id="hud">

        <div class="top-left">
            <div class="hud-label">POSITION</div>
            <div class="hud-value">1<span>/6</span></div>
        </div>

        <div class="race-info">
            <div class="hud-label">LAP</div>
            <div id="lap" class="hud-value">1<span>/2</span></div>
        </div>

        <div class="timer">
            <div class="hud-label">TIME</div>
            <div id="timer" class="hud-value">00:00.00</div>
        </div>

        <!-- Nitro -->
        <div class="nitro-box">
            <div class="nitro-title">NITRO</div>

            <div class="nitro-bar">
                <div id="nitro-fill"></div>
            </div>

            <div id="nitro-percent">100%</div>
        </div>

        <!-- Speedometer -->
        <div class="speedometer">

            <div class="speed-value">
                <span id="speed">0</span>
                <small>KM/H</small>
            </div>

            <div class="gear">
                GEAR
                <strong id="gear">N</strong>
            </div>

            <div class="rpm-container">
                <div class="rpm-bar">
                    <div id="rpm-fill"></div>
                </div>
                <span>RPM</span>
            </div>

        </div>

    </div>

    <!-- START SCREEN -->
    <div id="start-screen">

        <div class="logo">
            NEON
            <strong>STREET</strong>
            RACER
        </div>

        <p>ARCADE STREET RACING</p>

        <button id="start-btn">
            START RACE
        </button>

        <div class="controls">
            <span>W / ↑</span> ACCELERATE
            <span>S / ↓</span> BRAKE
            <span>A / ←</span> LEFT
            <span>D / →</span> RIGHT
            <span>SPACE</span> DRIFT
            <span>SHIFT</span> NITRO
            <span>R</span> RESET
            <span>ESC</span> PAUSE
        </div>

    </div>

    <!-- COUNTDOWN -->
    <div id="countdown"></div>

    <!-- PAUSE -->
    <div id="pause-menu">

        <h1>PAUSED</h1>

        <button id="resume-btn">
            RESUME
        </button>

        <button id="restart-btn">
            RESTART
        </button>

    </div>


    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Game -->
    <script src="script.js"></script>

</body>
</html>
