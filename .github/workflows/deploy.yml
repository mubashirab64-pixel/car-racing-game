name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Sync directly to web root
        run: |
          git config --global --add safe.directory /var/www/car-game
          git -C /var/www/car-game fetch origin main
          git -C /var/www/car-game reset --hard origin/main