name: Deploy Car Game to Local Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Nginx Web Root
        run: |
          echo "Deploying code to local Nginx server..."
          cp -r index.html style.css script.js /var/www/html/
          echo "Deployment Completed Successfully!"