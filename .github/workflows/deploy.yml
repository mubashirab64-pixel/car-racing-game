name: Deploy Car Game to Local Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Files to Web Root
        run: |
          cp -r ./* /var/www/car-game/
          sudo chmod -R 755 /var/www/car-game